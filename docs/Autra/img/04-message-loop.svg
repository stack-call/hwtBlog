<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img"><title>消息驱动：双向队列连接两个 Task</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="465" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="42" fill="#23364c" font-size="27" text-anchor="start" font-weight="700">04 / 消息驱动：双向队列连接两个 Task</text><text x="32" y="72" fill="#53677d" font-size="17" text-anchor="start" font-weight="400">Coordinator 等待 Inbox，Executor 等待工作；结果也是事件。</text><rect x="100" y="100" width="700" height="72" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.09" /><text x="450.0" y="131.0" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="700">Coordinator Task</text><text x="450.0" y="157.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">recv → transition → submit → recv</text><rect x="70" y="218" width="340" height="70" rx="9" stroke="#b86b12" stroke-width="1.5" fill="#b86b12" fill-opacity="0.09" /><text x="240.0" y="248.0" fill="#b86b12" font-size="20" text-anchor="middle" font-weight="700">Effect Queue</text><text x="240.0" y="274.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">CallModel / CallTool</text><rect x="490" y="218" width="340" height="70" rx="9" stroke="#7545bd" stroke-width="1.5" fill="#7545bd" fill-opacity="0.09" /><text x="660.0" y="248.0" fill="#7545bd" font-size="20" text-anchor="middle" font-weight="700">Event Inbox</text><text x="660.0" y="274.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">ModelCompleted / UserMessage</text><path d="M240 172L240 218" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M660 218L660 172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M240 288L240 342" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M660 342L660 288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="342" width="700" height="70" rx="9" stroke="#087f75" stroke-width="1.5" fill="#087f75" fill-opacity="0.09" /><text x="450.0" y="372.0" fill="#087f75" font-size="20" text-anchor="middle" font-weight="700">Executor Task</text><text x="450.0" y="398.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">recv → execute().await → send(result)</text><text x="450" y="442" fill="#23364c" font-size="19" text-anchor="middle" font-weight="700">两者都在 await，但等待的对象不同。</text></g></svg>