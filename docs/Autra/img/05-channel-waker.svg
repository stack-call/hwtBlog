<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img"><title>一次消息发送如何唤醒另一个 Task</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="450" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="42" fill="#23364c" font-size="27" text-anchor="start" font-weight="700">05 / 一次消息发送如何唤醒另一个 Task</text><text x="32" y="72" fill="#53677d" font-size="17" text-anchor="start" font-weight="400">Channel 不是线程：它保存消息，并通知等待它的 Task。</text><rect x="145" y="103" width="610" height="52" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.09" /><text x="450.0" y="124.0" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="700">Coordinator poll</text><text x="450.0" y="150.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">Inbox 为空，登记 Waker</text><path d="M450 155L450 168" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="145" y="168" width="610" height="52" rx="9" stroke="#64748b" stroke-width="1.5" fill="#64748b" fill-opacity="0.09" /><text x="450.0" y="189.0" fill="#64748b" font-size="20" text-anchor="middle" font-weight="700">返回 Pending</text><text x="450.0" y="215.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">线程转去执行其他 Task</text><path d="M450 220L450 233" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="145" y="233" width="610" height="52" rx="9" stroke="#b86b12" stroke-width="1.5" fill="#b86b12" fill-opacity="0.09" /><text x="450.0" y="254.0" fill="#b86b12" font-size="20" text-anchor="middle" font-weight="700">用户 Task 发送消息</text><text x="450.0" y="280.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">消息入队，触发 wake()</text><path d="M450 285L450 298" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="145" y="298" width="610" height="52" rx="9" stroke="#087f75" stroke-width="1.5" fill="#087f75" fill-opacity="0.09" /><text x="450.0" y="319.0" fill="#087f75" font-size="20" text-anchor="middle" font-weight="700">Tokio 重新调度</text><text x="450.0" y="345.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">Coordinator 获得 poll 机会</text><path d="M450 350L450 363" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="145" y="363" width="610" height="52" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.09" /><text x="450.0" y="384.0" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="700">Coordinator 取出消息</text><text x="450.0" y="410.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">处理事件，再次等待 Inbox</text></g></svg>