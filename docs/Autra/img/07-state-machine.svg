<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img"><title>状态机决定依赖，Executor 负责执行</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="400" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="42" fill="#23364c" font-size="27" text-anchor="start" font-weight="700">07 / 状态机决定依赖，Executor 负责执行</text><text x="32" y="72" fill="#53677d" font-size="17" text-anchor="start" font-weight="400">消息可以提前抵达，但下一次模型调用仍要遵循状态机条件。</text><rect x="45" y="103" width="810" height="66" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.09" /><text x="450.0" y="131.0" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="700">AwaitingTools { A, B }</text><text x="450.0" y="157.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">两个工具都未完成</text><path d="M450 169L450 192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="192" width="810" height="64" rx="9" stroke="#b86b12" stroke-width="1.5" fill="#b86b12" fill-opacity="0.09" /><text x="450.0" y="219.0" fill="#b86b12" font-size="20" text-anchor="middle" font-weight="700">收到 ToolCompleted(A)</text><text x="450.0" y="245.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">保存 A 的结果；仍然等待 B</text><path d="M450 256L450 279" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="279" width="810" height="64" rx="9" stroke="#087f75" stroke-width="1.5" fill="#087f75" fill-opacity="0.09" /><text x="450.0" y="306.0" fill="#087f75" font-size="20" text-anchor="middle" font-weight="700">收到 ToolCompleted(B)</text><text x="450.0" y="332.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">依赖满足 → 产生 CallModel</text><text x="450" y="378" fill="#23364c" font-size="18" text-anchor="middle" font-weight="700">批次屏障从 Executor 的调用结构，移动到了 Stepper 的语义。</text></g></svg>