<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img"><title>直接 await：一条 Task 调用链</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="410" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="42" fill="#23364c" font-size="27" text-anchor="start" font-weight="700">02 / 直接 await：一条 Task 调用链</text><text x="32" y="72" fill="#53677d" font-size="17" text-anchor="start" font-weight="400">子 Future 返回 Pending 时，外层 Task 也可能挂起。</text><rect x="65" y="96" width="770" height="265" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.09" stroke-dasharray="6 5" /><text x="90" y="124" fill="#2563eb" font-size="19" text-anchor="start" font-weight="700">同一个 Task</text><rect x="198" y="143" width="505" height="54" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.09" /><text x="450.5" y="165.0" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="700">Coordinator / drive()</text><text x="450.5" y="191.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">等待 execute() 返回</text><path d="M450 197L450 212" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="198" y="213" width="505" height="54" rx="9" stroke="#087f75" stroke-width="1.5" fill="#087f75" fill-opacity="0.09" /><text x="450.5" y="235.0" fill="#087f75" font-size="20" text-anchor="middle" font-weight="700">Executor Future</text><text x="450.5" y="261.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">等待 HTTP Future</text><path d="M450 267L450 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="198" y="283" width="505" height="54" rx="9" stroke="#b86b12" stroke-width="1.5" fill="#b86b12" fill-opacity="0.09" /><text x="450.5" y="305.0" fill="#b86b12" font-size="20" text-anchor="middle" font-weight="700">HTTP Future</text><text x="450.5" y="331.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">网络未就绪：Pending</text><path d="M703 310 H781 V170 H705" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="450" y="390" fill="#b86b12" font-size="19" text-anchor="middle" font-weight="700">线程空出来了，但这个 Coordinator 的主循环没有继续。</text></g></svg>