<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img"><title>同一个 Run：等待结果还是等待事件？</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="455" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="42" fill="#23364c" font-size="27" text-anchor="start" font-weight="700">06 / 同一个 Run：等待结果还是等待事件？</text><text x="32" y="72" fill="#53677d" font-size="17" text-anchor="start" font-weight="400">假设模型请求耗时 10 秒，第 3 秒用户发来新消息。</text><text x="32" y="115" fill="#23364c" font-size="21" text-anchor="start" font-weight="700">直接 await</text><text x="245" y="115" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">0s</text><path d="M245 124L245 235" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="425" y="115" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">3s</text><path d="M425 124L425 235" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="845" y="115" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">10s</text><path d="M845 124L845 235" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="32" y="157" fill="#53677d" font-size="18" text-anchor="start" font-weight="400">模型请求</text><rect x="245" y="130" width="600" height="36" rx="9" stroke="#087f75" stroke-width="1.5" fill="#087f75" fill-opacity="0.09" /><text x="545.0" y="155" fill="#087f75" font-size="17" text-anchor="middle" font-weight="400">LLM 执行中</text><text x="32" y="209" fill="#53677d" font-size="18" text-anchor="start" font-weight="400">Coordinator</text><rect x="245" y="182" width="600" height="37" rx="9" stroke="#64748b" stroke-width="1.5" fill="#64748b" fill-opacity="0.09" stroke-dasharray="6 5" /><text x="545" y="207" fill="#53677d" font-size="17" text-anchor="middle" font-weight="400">等待指定结果</text><text x="425" y="252" fill="#b86b12" font-size="16" text-anchor="middle" font-weight="400">↑ 用户新消息</text><text x="32" y="282" fill="#23364c" font-size="21" text-anchor="start" font-weight="700">消息驱动</text><text x="245" y="282" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">0s</text><path d="M245 291L245 402" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="425" y="282" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">3s</text><path d="M425 291L425 402" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="845" y="282" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">10s</text><path d="M845 291L845 402" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="32" y="324" fill="#53677d" font-size="18" text-anchor="start" font-weight="400">模型请求</text><rect x="245" y="297" width="600" height="36" rx="9" stroke="#087f75" stroke-width="1.5" fill="#087f75" fill-opacity="0.09" /><text x="545.0" y="322" fill="#087f75" font-size="17" text-anchor="middle" font-weight="400">LLM 执行中</text><text x="32" y="376" fill="#53677d" font-size="18" text-anchor="start" font-weight="400">Coordinator</text><rect x="245" y="349" width="600" height="37" rx="9" stroke="#64748b" stroke-width="1.5" fill="#64748b" fill-opacity="0.09" stroke-dasharray="6 5" /><text x="545" y="374" fill="#53677d" font-size="17" text-anchor="middle" font-weight="400">等待任意事件</text><rect x="425" y="349" width="126" height="37" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#dbeafe" /><text x="488" y="374" fill="#2563eb" font-size="16" text-anchor="middle" font-weight="700">处理消息</text><text x="425" y="419" fill="#b86b12" font-size="16" text-anchor="middle" font-weight="400">↑ 用户新消息</text></g></svg>