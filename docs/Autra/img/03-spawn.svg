<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" role="img"><title>spawn：独立 Task 不等于独立控制流</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="375" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="42" fill="#23364c" font-size="27" text-anchor="start" font-weight="700">03 / spawn：独立 Task 不等于独立控制流</text><text x="32" y="72" fill="#53677d" font-size="17" text-anchor="start" font-weight="400">Executor 被单独调度，但 Coordinator 仍然等待指定结果。</text><rect x="50" y="108" width="340" height="95" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.09" /><text x="220.0" y="150.5" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="700">Task A：Coordinator</text><text x="220.0" y="176.5" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">handle.await</text><rect x="510" y="108" width="340" height="95" rx="9" stroke="#087f75" stroke-width="1.5" fill="#087f75" fill-opacity="0.09" /><text x="680.0" y="150.5" fill="#087f75" font-size="20" text-anchor="middle" font-weight="700">Task B：Executor</text><text x="680.0" y="176.5" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">execute().await</text><path d="M390 142L510 142" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="450" y="130" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">spawn</text><path d="M510 185L390 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="450" y="174" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">结果</text><path d="M220 203L220 247" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M680 203L680 247" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="247" width="800" height="65" rx="9" stroke="#64748b" stroke-width="1.5" fill="#64748b" fill-opacity="0.09" /><text x="450.0" y="274.5" fill="#64748b" font-size="20" text-anchor="middle" font-weight="700">共享 Tokio Runtime</text><text x="450.0" y="300.5" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">两个 Task 可以在同一线程或不同线程推进</text><text x="450" y="350" fill="#b86b12" font-size="20" text-anchor="middle" font-weight="700">等待 JoinHandle ≠ 等待任意事件</text></g></svg>