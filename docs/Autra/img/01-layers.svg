<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img"><title>两层不同的问题</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="385" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="42" fill="#23364c" font-size="27" text-anchor="start" font-weight="700">01 / 两层不同的问题</text><text x="32" y="72" fill="#53677d" font-size="17" text-anchor="start" font-weight="400">Tokio 决定谁执行；应用架构决定任务如何协作。</text><rect x="52" y="105" width="796" height="65" rx="9" stroke="#7545bd" stroke-width="1.5" fill="#7545bd" fill-opacity="0.09" /><text x="450.0" y="132.5" fill="#7545bd" font-size="20" text-anchor="middle" font-weight="700">应用层：Coordinator ↔ Executor</text><text x="450.0" y="158.5" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">函数调用、JoinHandle 或消息队列</text><path d="M450 170L450 195" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="52" y="195" width="796" height="64" rx="9" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.09" /><text x="450.0" y="222.0" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="700">Tokio Scheduler</text><text x="450.0" y="248.0" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">选择就绪 Task，调用 Future::poll()</text><path d="M450 259L450 284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="52" y="287" width="190" height="65" rx="9" stroke="#64748b" stroke-width="1.5" fill="#64748b" fill-opacity="0.09" /><text x="147.0" y="314.5" fill="#64748b" font-size="20" text-anchor="middle" font-weight="700">OS Thread 1</text><text x="147.0" y="340.5" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">执行代码</text><rect x="254" y="287" width="190" height="65" rx="9" stroke="#64748b" stroke-width="1.5" fill="#64748b" fill-opacity="0.09" /><text x="349.0" y="314.5" fill="#64748b" font-size="20" text-anchor="middle" font-weight="700">OS Thread 2</text><text x="349.0" y="340.5" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">执行代码</text><rect x="456" y="287" width="190" height="65" rx="9" stroke="#64748b" stroke-width="1.5" fill="#64748b" fill-opacity="0.09" /><text x="551.0" y="314.5" fill="#64748b" font-size="20" text-anchor="middle" font-weight="700">OS Thread 3</text><text x="551.0" y="340.5" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">执行代码</text><rect x="658" y="287" width="190" height="65" rx="9" stroke="#64748b" stroke-width="1.5" fill="#64748b" fill-opacity="0.09" /><text x="753.0" y="314.5" fill="#64748b" font-size="20" text-anchor="middle" font-weight="700">OS Thread 4</text><text x="753.0" y="340.5" fill="#53677d" font-size="16" text-anchor="middle" font-weight="400">执行代码</text></g></svg>