<rect x="290" y="144" width="510" height="27" rx="5" fill="#EDF1F5"/><rect x="290" y="144" width="510.0" height="27" rx="4" fill="#365DAD"/>
<text x="885" y="164" text-anchor="end" font-size="16" font-weight="600" fill="#182D43">30,000</text>
