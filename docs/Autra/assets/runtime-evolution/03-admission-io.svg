<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-label="资源许可与阻塞 I/O 是两个不同的边界">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#68798A"/></marker></defs>
<rect width="920" height="330" rx="18" fill="#FFFFFF" stroke="#DBE2E9"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#182D43">
<text x="30" y="34" text-anchor="start" font-size="23" font-weight="600" fill="#182D43">资源许可与阻塞 I/O 是两个不同的边界</text>
<text x="30" y="61" text-anchor="start" font-size="14" font-weight="400" fill="#536477">业务许可控制外部并发；Blocking Pool 保护异步调度线程。</text>
<rect x="35" y="94" width="240" height="57" rx="9" fill="#E5F4EF" stroke="#167B68" stroke-width="1.2"/>
<text x="155.0" y="127.5" text-anchor="middle" font-size="16" font-weight="600" fill="#167B68">已就绪的 Effect</text>
<path d="M275 122 L335 122" fill="none" stroke="#68798A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335" y="94" width="250" height="57" rx="9" fill="#EAF0FF" stroke="#365DAD" stroke-width="1.2"/>
<text x="460.0" y="119.5" text-anchor="middle" font-size="16" font-weight="600" fill="#365DAD">GlobalScheduler</text>
<text x="460.0" y="140.5" text-anchor="middle" font-size="13" font-weight="400" fill="#365DAD">Model / Tool / Process</text>
<path d="M585 122 L645 122" fill="none" stroke="#68798A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="645" y="94" width="240" height="57" rx="9" fill="#F1EAFE" stroke="#7445AA" stroke-width="1.2"/>
<text x="765.0" y="127.5" text-anchor="middle" font-size="16" font-weight="600" fill="#7445AA">实际外部调用</text>
<rect x="35" y="209" width="240" height="65" rx="9" fill="#EAF0FF" stroke="#365DAD" stroke-width="1.2"/>
<text x="155.0" y="238.5" text-anchor="middle" font-size="16" font-weight="600" fill="#365DAD">Coordinator Task</text>
<text x="155.0" y="259.5" text-anchor="middle" font-size="13" font-weight="400" fill="#365DAD">提交 Transition</text>
<path d="M275 241 L335 241" fill="none" stroke="#68798A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335" y="209" width="250" height="65" rx="9" fill="#FFF2DF" stroke="#AE691B" stroke-width="1.2"/>
<text x="460.0" y="238.5" text-anchor="middle" font-size="16" font-weight="600" fill="#AE691B">spawn_blocking</text>
<text x="460.0" y="259.5" text-anchor="middle" font-size="13" font-weight="400" fill="#AE691B">阻塞线程池</text>
<path d="M585 241 L645 241" fill="none" stroke="#68798A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="645" y="209" width="240" height="65" rx="9" fill="#EDF1F5" stroke="#536477" stroke-width="1.2"/>
<text x="765.0" y="238.5" text-anchor="middle" font-size="16" font-weight="600" fill="#536477">SQLite</text>
<text x="765.0" y="259.5" text-anchor="middle" font-size="13" font-weight="400" fill="#536477">单 Writer 事务</text>
<text x="35" y="309" text-anchor="start" font-size="15" font-weight="400" fill="#182D43">注意：当前只隔离部分同步 Journal 操作；线程池不能消除 SQLite 写锁竞争。</text>
</g></svg>