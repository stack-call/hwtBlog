<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-label="可靠性：通知可以丢失，持久化工作不能丢">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#68798A"/></marker></defs>
<rect width="920" height="340" rx="18" fill="#FFFFFF" stroke="#DBE2E9"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#182D43">
<text x="30" y="34" text-anchor="start" font-size="23" font-weight="600" fill="#182D43">可靠性：通知可以丢失，持久化工作不能丢</text>
<text x="30" y="61" text-anchor="start" font-size="14" font-weight="400" fill="#536477">事务提交是权威事实，通知只负责降低发现延迟。</text>
<rect x="30" y="96" width="230" height="65" rx="9" fill="#E5F4EF" stroke="#167B68" stroke-width="1.2"/>
<text x="145.0" y="133.5" text-anchor="middle" font-size="16" font-weight="600" fill="#167B68">提交 Outbox</text>
<rect x="345" y="96" width="230" height="65" rx="9" fill="#FDECEB" stroke="#B63D37" stroke-width="1.2"/>
<text x="460.0" y="133.5" text-anchor="middle" font-size="16" font-weight="600" fill="#B63D37">进程崩溃 / 未通知</text>
<rect x="660" y="96" width="230" height="65" rx="9" fill="#EAF0FF" stroke="#365DAD" stroke-width="1.2"/>
<text x="775.0" y="133.5" text-anchor="middle" font-size="16" font-weight="600" fill="#365DAD">重启后恢复扫描</text>
<path d="M260 128 L345 128" fill="none" stroke="#68798A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M575 128 L660 128" fill="none" stroke="#68798A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="207" width="860" height="60" rx="9" fill="#E5F4EF" stroke="#167B68" stroke-width="1.2"/>
<text x="460.0" y="234.0" text-anchor="middle" font-size="16" font-weight="600" fill="#167B68">Durable Journal：已提交的 Effect 仍然存在</text>
<text x="460.0" y="255.0" text-anchor="middle" font-size="13" font-weight="400" fill="#167B68">扫描 / 索引查询 → 重新发现 → 容量许可 → Claim</text>
<path d="M145 161 V207" fill="none" stroke="#68798A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M775 161 V207" fill="none" stroke="#68798A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="30" y="309" text-anchor="start" font-size="15" font-weight="400" fill="#182D43">仅对可持久化 Journal 成立；MemoryJournal 不提供跨进程重启的持久性。</text>
</g></svg>