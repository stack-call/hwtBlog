<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" role="img"><title>03 / 一个线程，三个任务</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="40" font-size="27" text-anchor="start" fill="#1c2c43" font-weight="700">03 / 一个线程，三个任务</text><text x="32" y="70" font-size="17" text-anchor="start" fill="#52627a" font-weight="400">A 等待网络；B、C 不需要等待 A。每一行是一个时刻的快照。</text><text x="40" y="109" font-size="19" text-anchor="start" fill="#1c2c43" font-weight="650">步骤</text><text x="220" y="109" font-size="19" text-anchor="start" fill="#1c2c43" font-weight="650">线程正在执行</text><text x="470" y="109" font-size="19" text-anchor="start" fill="#1c2c43" font-weight="650">就绪队列</text><text x="700" y="109" font-size="19" text-anchor="start" fill="#1c2c43" font-weight="650">等待 I/O</text><text x="40" y="150" font-size="19" text-anchor="start" fill="#1c2c43" font-weight="400">① 初始</text><rect x="220" y="122" width="205" height="38" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="322.5" y="148.0" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">Scheduler</text><rect x="470" y="122" width="185" height="38" rx="10" fill="#edf1f5" stroke="#52627a" stroke-width="1.6"/><text x="562.5" y="148.0" font-size="20" text-anchor="middle" fill="#52627a" font-weight="650">A  B  C</text><rect x="700" y="122" width="160" height="38" rx="10" fill="#fff0d5" stroke="#a15b13" stroke-width="1.6"/><text x="780.0" y="148.0" font-size="20" text-anchor="middle" fill="#a15b13" font-weight="650">—</text><text x="40" y="195" font-size="19" text-anchor="start" fill="#1c2c43" font-weight="400">② 选择 A</text><rect x="220" y="167" width="205" height="38" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text