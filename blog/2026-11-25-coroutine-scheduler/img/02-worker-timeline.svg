<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" width="900" height="275" role="img"><title>02 / 同一条线程，交替执行两种代码</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="40" font-size="27" text-anchor="start" fill="#1c2c43" font-weight="700">02 / 同一条线程，交替执行两种代码</text><text x="32" y="70" font-size="17" text-anchor="start" fill="#52627a" font-weight="400">调度器并不是另一个必须同时运行的线程。</text><rect x="33" y="122" width="93" height="55" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="79.5" y="156.5" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">调度</text><rect x="133" y="122" width="145" height="55" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="205.5" y="156.5" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">poll(A)</text><rect x="285" y="122" width="93" height="55" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="331.5" y="156.5" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">调度</text><rect x="385" y="122" width="123" height="55" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="446.5" y="156.5" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">poll(B)</text><rect x="515" y="122" width="93" height="55" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="561.5" y="156.5" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">调度</text><rect x="615" y="122" width="145" height="55" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="687.5" y="156.5" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">poll(A)</text><text x="180" y="108" font-size="16" text-anchor="middle" fill="#a15b13" font-weight="400">A 返回 Pending</text><text x="633" y="108" font-size="16" text-anchor="middle" fill="#a15b13" font-weight="400">A 被唤醒后再次调度</text><path d="M35 205L862 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="235" font-size="18" text-anchor="middle" fill="#1c2c43" font-weight="400">时间 →    调度代码和业务代码共享同一个线程</text></g></svg>