<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" width="900" height="365" role="img"><title>08 / Autra：三个不同层次的调度</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="40" font-size="27" text-anchor="start" fill="#1c2c43" font-weight="700">08 / Autra：三个不同层次的调度</text><text x="32" y="70" font-size="17" text-anchor="start" fill="#52627a" font-weight="400">Run 的状态循环暂停，不意味着操作系统线程被阻塞。</text><rect x="140" y="100" width="620" height="58" rx="10" fill="#eee8fa" stroke="#7550a6" stroke-width="1.6"/><text x="450.0" y="126.0" font-size="20" text-anchor="middle" fill="#7550a6" font-weight="650">OS Scheduler</text><text x="450.0" y="149.0" font-size="16" text-anchor="middle" fill="#7550a6" font-weight="400">决定线程何时获得 CPU 执行机会</text><path d="M450 158L450 180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="140" y="180" width="620" height="58" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="450.0" y="206.0" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">Tokio Scheduler</text><text x="450.0" y="229.0" font-size="16" text-anchor="middle" fill="#315fbc" font-weight="400">决定哪个就绪 Task 被 poll</text><path d="M450 238L450 260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="140" y="260" width="620" height="58" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="450.0" y="286.0" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">Autra GlobalScheduler</text><text x="450.0" y="309.0" font-size="16" text-anchor="middle" fill="#197459" font-weight="400">限制 Model / Tool / Process 资源准入</text><text x="450" y="350" font-size="18" text-anchor="middle" fill="#1c2c43" font-weight="400">三种调度关注的对象不同，并不各自需要一套线程池。</text></g></svg>