<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" width="900" height="435" role="img"><title>01 / 两级调度</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="40" font-size="27" text-anchor="start" fill="#1c2c43" font-weight="700">01 / 两级调度</text><text x="32" y="70" font-size="17" text-anchor="start" fill="#52627a" font-weight="400">操作系统分配 CPU 执行机会，Tokio 分配线程内的执行机会。</text><rect x="260" y="100" width="380" height="58" rx="10" fill="#eee8fa" stroke="#7550a6" stroke-width="1.6"/><text x="450.0" y="126.0" font-size="20" text-anchor="middle" fill="#7550a6" font-weight="650">OS Scheduler</text><text x="450.0" y="149.0" font-size="16" text-anchor="middle" fill="#7550a6" font-weight="400">内核调度线程</text><path d="M450 158L450 182" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 182H235V200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 182H665V200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="200" width="340" height="65" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="235.0" y="229.5" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">Worker Thread 1</text><text x="235.0" y="252.5" font-size="16" text-anchor="middle" fill="#315fbc" font-weight="400">OS 线程</text><path d="M235 265L235 288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="288" width="340" height="62" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="235.0" y="316.0" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">Tokio 调度循环</text><text x="235.0" y="339.0" font-size="16" text-anchor="middle" fill="#197459" font-weight="400">选择