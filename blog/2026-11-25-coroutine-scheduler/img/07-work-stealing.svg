<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img"><title>07 / 多线程调度与 Work Stealing</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="40" font-size="27" text-anchor="start" fill="#1c2c43" font-weight="700">07 / 多线程调度与 Work Stealing</text><text x="32" y="70" font-size="17" text-anchor="start" fill="#52627a" font-weight="400">Worker 自己取任务；空闲 Worker 可以从其他 Worker 的队列获取工作。</text><rect x="270" y="95" width="360" height="46" rx="10" fill="#edf1f5" stroke="#52627a" stroke-width="1.6"/><text x="450.0" y="125.0" font-size="20" text-anchor="middle" fill="#52627a" font-weight="650">共享全局队列</text><path d="M450 141V156H230V173" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 156H670V173" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="173" width="400" height="48" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="230.0" y="204.0" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">Worker 1 · 调度循环</text><text x="230" y="245" font-size="18" text-anchor="middle" fill="#1c2c43" font-weight="400">本地就绪队列</text><rect x="470" y="173" width="400" height="48" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="670.0" y="204.0" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">Worker 2 · 调度循环</text><text x="670" y="245" font-size="18" text-anchor="middle" fill="#1c2c43" font-weight="400">本地就绪队列</text><rect x="45" y="258" width="82" height="43" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="86.0" y="286.5" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">A</text><rect x="136" y="258" width="82" height="43" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="177.0" y="286.5" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">B</text><rect x="227" y="258" width="82" height="43" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="268.0" y="286.5" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">C</text><rect x="318" y="258" width="82" height="43" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="359.0" y="286.5" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">D</text><rect x="485" y="258" width="370" height="43" rx="10" fill="#edf1f5" stroke="#52627a" stroke-width="1.6" stroke-dasharray="6 5"/><text x="670.0" y="286.5" font-size="20" text-anchor="middle" fill="#52627a" font-weight="650">空闲</text><path d="M417 279L482 279" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="325" font-size="18" text-anchor="middle" fill="#1c2c43" font-weight="400">任务窃取（示意，实际算法还有其他优化）</text></g></svg>