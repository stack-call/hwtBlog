<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img"><title>04 / Future 保存了什么？</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="40" font-size="27" text-anchor="start" fill="#1c2c43" font-weight="700">04 / Future 保存了什么？</text><text x="32" y="70" font-size="17" text-anchor="start" fill="#52627a" font-weight="400">跨越 await 仍需保留的数据与执行进度，都属于 Future 的状态。</text><rect x="30" y="128" width="195" height="70" rx="10" fill="#edf1f5" stroke="#52627a" stroke-width="1.6"/><text x="127.5" y="160.0" font-size="20" text-anchor="middle" fill="#52627a" font-weight="650">初始</text><text x="127.5" y="183.0" font-size="16" text-anchor="middle" fill="#52627a" font-weight="400">尚未开始执行</text><path d="M225 163L250 163" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="128" width="195" height="70" rx="10" fill="#fff0d5" stroke="#a15b13" stroke-width="1.6"/><text x="347.5" y="160.0" font-size="20" text-anchor="middle" fill="#a15b13" font-weight="650">等待请求</text><text x="347.5" y="183.0" font-size="16" text-anchor="middle" fill="#a15b13" font-weight="400">保存局部变量与进度</text><path d="M445 163L470 163" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="128" width="195" height="70" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="567.5" y="160.0" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">继续执行</text><text x="567.5" y="183.0" font-size="16" text-anchor="middle" fill="#315fbc" font-weight="400">读取结果，处理数据</text><path d="M665 163L690 163" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="128" width="195" height="70" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="787.5" y="160.0" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">完成</text><text x="787.5" y="183.0" font-size="16" text-anchor="middle" fill="#197459" font-weight="400">返回 Ready(value)</text><text x="450" y="245" font-size="19" text-anchor="middle" fill="#1c2c43" font-weight="400">第一次 poll：遇到未就绪的 Future，返回 Pending</text><text x="450" y="280" font-size="19" text-anchor="middle" fill="#1c2c43" font-weight="400">下一次 poll：从保存的状态继续，而不是从头执行</text></g></svg>