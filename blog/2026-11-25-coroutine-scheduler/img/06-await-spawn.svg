<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" width="900" height="365" role="img"><title>06 / await 与 spawn 的区别</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="40" font-size="27" text-anchor="start" fill="#1c2c43" font-weight="700">06 / await 与 spawn 的区别</text><text x="32" y="70" font-size="17" text-anchor="start" fill="#52627a" font-weight="400">async 函数的数量，不等于 Tokio Task 的数量。</text><text x="229" y="108" font-size="23" text-anchor="middle" fill="#1c2c43" font-weight="700">直接 await</text><text x="666" y="108" font-size="23" text-anchor="middle" fill="#1c2c43" font-weight="700">tokio::spawn</text><rect x="50" y="130" width="365" height="68" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="232.5" y="161.0" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">Task 1 / parent</text><text x="232.5" y="184.0" font-size="16" text-anchor="middle" fill="#315fbc" font-weight="400">同一次 poll 调用链</text><rect x="85" y="225" width="295" height="56" rx="10" fill="#edf1f5" stroke="#52627a" stroke-width="1.6"/><text x="232.5" y="250.0" font-size="20" text-anchor="middle" fill="#52627a" font-weight="650">child Future</text><text x="232.5" y="273.0" font-size="16" text-anchor="middle" fill="#52627a" font-weight="400">没有独立调度单位</text><path d="M232 198L232 225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="130" width="365" height="68" rx="10" fill="#e7efff" stroke="#315fbc" stroke-width="1.6"/><text x="672.5" y="161.0" font-size="20" text-anchor="middle" fill="#315fbc" font-weight="650">Task 1 / parent</text><text x="672.5" y="184.0" font-size="16" text-anchor="middle" fill="#315fbc" font-weight="400">等待 JoinHandle</text><rect x="490" y="225" width="365" height="68" rx="10" fill="#e0f4ec" stroke="#197459" stroke-width="1.6"/><text x="672.5" y="256.0" font-size="20" text-anchor="middle" fill="#197459" font-weight="650">Task 2 / child</text><text x="672.5" y="279.0" font-size="16" text-anchor="middle" fill="#197459" font-weight="400">可独立调度</text><path d="M672 198L672 225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="450" y="330" font-size="18" text-anchor="middle" fill="#1c2c43" font-weight="400">两个 Task 仍可以共享同一条 Worker 线程</text></g></svg>