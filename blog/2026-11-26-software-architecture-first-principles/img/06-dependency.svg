<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" aria-label="依赖倒置的两个方向"><title>依赖倒置的两个方向</title><defs><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176b68"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315c91"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94601b"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4945"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596d7d"/></marker></defs><rect width="960" height="100%" rx="16" fill="#f8fafb"/><rect x="0" y="0" width="960" height="7" rx="3" fill="#176b68"/><text x="30" y="40" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#176b68">ARCHITECTURE  /  06</text><text x="30" y="76" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#193042">依赖倒置的两个方向</text><text x="30" y="104" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#526879">实线表示源代码依赖；虚线表示运行时调用</text><rect x="35" y="164" width="260" height="78" rx="10" fill="#e6eef9" stroke="#315c91" stroke-width="1.4" /><text x="165.0" y="203.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#315c91">CreateOrder</text><text x="165.0" y="227.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">应用用例</text><rect x="350" y="164" width="260" height="78" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="480.0" y="203.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">Repository 端口</text><text x="480.0" y="227.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">由内层定义</text><rect x="665" y="164" width="260" height="78" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="795.0" y="203.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">PostgreSQL 适配器</text><text x="795.0" y="227.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">由外层实现</text><path d="M295 203 L350 203" fill="none" stroke="#315c91" stroke-width="2"  marker-end="url(#ablue)"/><path d="M665 203 L610 203" fill="none" stroke="#94601b" stroke-width="2"  marker-end="url(#aamber)"/><path d="M165 242 V298 H795 V242" fill="none" stroke="#596d7d" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#agray)"/><text x="480" y="287" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#526879">运行时通过注入的对象调用具体实现</text><text x="30" y="363" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">核心代码不 import 具体存储适配器，但运行时仍需执行真实的持久化操作。</text></svg>