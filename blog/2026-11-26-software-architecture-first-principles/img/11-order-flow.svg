Fang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">前端状态</text><rect x="25" y="350" width="910" height="49" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="480.0" y="380.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">全过程：权限校验 · 日志与追踪 · 测试与故障恢复</text><text x="30" y="426" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">业务流程设计不仅需要成功路径，还要覆盖失败、超时、重复与恢复。</text></svg>