d="url(#ateal)"/><text x="30" y="356" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">接口不仅包括输入和输出，也包括错误、权限、幂等与行为语义。</text></svg>