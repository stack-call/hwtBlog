<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-label="软件架构的第一性原理"><title>软件架构的第一性原理</title><defs><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176b68"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315c91"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94601b"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4945"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596d7d"/></marker></defs><rect width="960" height="100%" rx="16" fill="#f8fafb"/><rect x="0" y="0" width="960" height="7" rx="3" fill="#176b68"/><text x="30" y="40" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#176b68">ARCHITECTURE  /  01</text><text x="30" y="76" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#193042">软件架构的第一性原理</text><text x="30" y="104" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#526879">从业务目标出发，以结构、行为与约束控制复杂度</text><rect x="350" y="127" width="260" height="60" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="480.0" y="157.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">业务目标</text><text x="480.0" y="181.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">正确性 · 质量目标</text><path d="M480 187 L480 211" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><rect x="30" y="225" width="280" height="76" rx="10" fill="#e6eef9" stroke="#315c91" stroke-width="1.4" /><text x="170.0" y="263.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#315c91">组成与边界</text><text x="170.0" y="287.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">模块 / 服务 / 数据所有权</text><path d="M480 211 H170 V225" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><rect x="340" y="225" width="280" height="76" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="480.0" y="263.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">依赖与交互</text><text x="480.0" y="287.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">接口 / 调用 / 事件</text><path d="M480 211 H480 V225" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><rect x="650" y="225" width="280" height="76" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="790.0" y="263.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">状态与约束</text><text x="790.0" y="287.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">不变量 / 安全 / 故障</text><path d="M480 211 H790 V225" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><text x="30" y="346" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">目标：以可承担的成本，保持系统正确、可理解、可修改、可运行。</text></svg>