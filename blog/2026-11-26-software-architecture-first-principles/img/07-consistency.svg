<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img" aria-label="跨服务一致性与恢复"><title>跨服务一致性与恢复</title><defs><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176b68"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315c91"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94601b"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4945"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596d7d"/></marker></defs><rect width="960" height="100%" rx="16" fill="#f8fafb"/><rect x="0" y="0" width="960" height="7" rx="3" fill="#176b68"/><text x="30" y="40" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#176b68">ARCHITECTURE  /  07</text><text x="30" y="76" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#193042">跨服务一致性与恢复</text><text x="30" y="104" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#526879">示意流程：库存预留、支付确认，以及失败后的业务补偿</text><rect x="25" y="145" width="202" height="76" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="126.0" y="183.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">待支付订单</text><text x="126.0" y="207.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">订单模块</text><path d="M227 183 L261 183" fill="none" stroke="#176b68" stroke-width="2"  marker-end="url(#ateal)"/><rect x="261" y="145" width="202" height="76" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="362.0" y="183.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">预留库存</text><text x="362.0" y="207.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">库存模块</text><path d="M463 183 L497 183" fill="none" stroke="#176b68" stroke-width="2"  marker-end="url(#ateal)"/><rect x="497" y="145" width="202" height="76" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="598.0" y="183.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">发起支付</text><text x="598.0" y="207.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">支付模块</text><path d="M699 183 L733 183" fill="none" stroke="#176b68" stroke-width="2"  marker-end="url(#ateal)"/><rect x="733" y="145" width="202" height="76" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="834.0" y="183.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">确认订单</text><text x="834.0" y="207.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">订单模块</text><path d="M598 221 V248 H240 V270" fill="none" stroke="#ad4945" stroke-width="2"  marker-end="url(#ared)"/><rect x="100" y="270" width="280" height="78" rx="10" fill="#fbe7e4" stroke="#ad4945" stroke-width="1.4" /><text x="240.0" y="309.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#ad4945">明确失败：释放库存</text><text x="240.0" y="333.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">补偿 / 更新订单</text><path d="M598 221 V270" fill="none" stroke="#94601b" stroke-width="2"  marker-end="url(#aamber)"/><rect x="458" y="270" width="280" height="78" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="598.0" y="309.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">结果未知：查询对账</text><text x="598.0" y="333.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">避免盲目重复扣款</text><text x="30" y="396" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">跨系统补偿不是本地事务回滚；应设计幂等、重试与人工恢复路径。</text></svg>