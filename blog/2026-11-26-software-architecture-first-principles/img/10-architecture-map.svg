<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="架构决策地图"><title>架构决策地图</title><defs><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176b68"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315c91"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94601b"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4945"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596d7d"/></marker></defs><rect width="960" height="100%" rx="16" fill="#f8fafb"/><rect x="0" y="0" width="960" height="7" rx="3" fill="#176b68"/><text x="30" y="40" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#176b68">ARCHITECTURE  /  10</text><text x="30" y="76" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#193042">架构决策地图</text><text x="30" y="104" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#526879">不同视图描述同一个系统，横向治理贯穿设计与运行</text><rect x="35" y="130" width="560" height="60" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="315.0" y="160.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">业务架构</text><text x="315.0" y="184.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">业务规则 / 不变量 / 领域边界</text><path d="M315 190 L315 207" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><rect x="35" y="207" width="560" height="60" rx="10" fill="#e6eef9" stroke="#315c91" stroke-width="1.4" /><text x="315.0" y="237.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#315c91">应用与代码架构</text><text x="315.0" y="261.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">模块 / 前后端 / 分层 / 依赖</text><path d="M315 267 L315 284" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><rect x="35" y="284" width="560" height="60" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="315.0" y="314.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">数据与通信架构</text><text x="315.0" y="338.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">所有权 / 事务 / 接口 / 事件</text><path d="M315 344 L315 361" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><rect x="35" y="361" width="560" height="60" rx="10" fill="#eaf0f3" stroke="#596d7d" stroke-width="1.4" /><text x="315.0" y="391.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#596d7d">运行与部署架构</text><text x="315.0" y="415.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">进程 / 容器 / 网络 / 恢复</text><rect x="630" y="130" width="295" height="291" rx="12" fill="none" stroke="#94601b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="777" y="157" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">横向治理</text><rect x="648" y="174" width="259" height="47" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="777.5" y="203.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">安全与权限</text><rect x="648" y="231" width="259" height="47" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="777.5" y="260.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">可观测性</text><rect x="648" y="288" width="259" height="47" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="777.5" y="317.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">工程化与测试</text><rect x="648" y="345" width="259" height="47" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="777.5" y="374.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">性能与可靠性</text><text x="30" y="471" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">这些是设计视图，不是程序必须遵循的固定运行调用顺序。</text></svg>