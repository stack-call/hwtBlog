nchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">订单</text><rect x="786" y="170" width="108" height="50" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="840.0" y="201.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">支付</text><rect x="546" y="280" width="108" height="50" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="600.0" y="311.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">库存</text><rect x="786" y="280" width="108" height="50" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="840.0" y="311.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">物流</text><text x="30" y="381" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">重点不是消除所有依赖，而是避免变化通过无关的实现细节向外扩散。</text></svg>