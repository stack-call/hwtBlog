<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-label="程序的基本机制"><title>程序的基本机制</title><defs><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176b68"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315c91"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94601b"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4945"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596d7d"/></marker></defs><rect width="960" height="100%" rx="16" fill="#f8fafb"/><rect x="0" y="0" width="960" height="7" rx="3" fill="#176b68"/><text x="30" y="40" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#176b68">ARCHITECTURE  /  02</text><text x="30" y="76" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#193042">程序的基本机制</text><text x="30" y="104" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#526879">输入触发规则，规则读取或改变状态，输出形成反馈</text><rect x="35" y="142" width="260" height="76" rx="10" fill="#e6eef9" stroke="#315c91" stroke-width="1.4" /><text x="165.0" y="180.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#315c91">输入</text><text x="165.0" y="204.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">请求 / 事件</text><rect x="350" y="142" width="260" height="76" rx="10" fill="#e1f2ed" stroke="#176b68" stroke-width="1.4" /><text x="480.0" y="180.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#176b68">处理规则</text><text x="480.0" y="204.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">校验 / 计算 / 决策</text><rect x="665" y="142" width="260" height="76" rx="10" fill="#e6eef9" stroke="#315c91" stroke-width="1.4" /><text x="795.0" y="180.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#315c91">输出</text><text x="795.0" y="204.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">结果 / 事件</text><path d="M295 180 L350 180" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><path d="M610 180 L665 180" fill="none" stroke="#596d7d" stroke-width="2"  marker-end="url(#agray)"/><rect x="350" y="259" width="260" height="60" rx="10" fill="#fff0d4" stroke="#94601b" stroke-width="1.4" /><text x="480.0" y="289.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#94601b">状态</text><text x="480.0" y="313.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">内存 / 持久数据</text><path d="M440 218 L440 259" fill="none" stroke="#94601b" stroke-width="2"  marker-end="url(#aamber)"/><path d="M520 259 L520 218" fill="none" stroke="#94601b" stroke-width="2"  marker-end="url(#aamber)"/><text x="30" y="346" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#526879">状态改变必须满足业务不变量；输出也可以成为其他处理过程的输入。</text></svg>