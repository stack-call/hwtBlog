<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="消息是载体，Command 和 Event 是语义"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="390" rx="18" fill="#ffffff"/><rect x="1" y="1" width="958" height="388" rx="18" fill="none" stroke="#cbd5e1"/><text x="35" y="42" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172554">消息是载体，Command 和 Event 是语义</text><text x="35" y="72" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">请求执行、已发生事实、查询和回复是不同的协议角色。</text><rect x="35" y="105" width="435" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="252.5" y="151.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2563eb">Command · 命令</text><text x="252.5" y="176.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#334155">CallModel：请执行模型调用</text><rect x="485" y="105" width="435" height="100" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="702.5" y="151.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f766e">Event · 事件</text><text x="702.5" y="176.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#334155">ModelCompleted：模型调用已完成</text><rect x="35" y="230" width="435" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="252.5" y="276.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#7c3aed">Query · 查询</text><text x="252.5" y="301.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#334155">GetRunStatus：请求当前状态</text><rect x="485" y="230" width="435" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="702.5" y="276.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#b45309">Reply · 回复</text><text x="702.5" y="301.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#334155">RunStatus：返回查询结果</text><text x="480" y="365" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172554">同一个 Channel 可以承载这些消息；不等于每条消息都需要广播。</text></svg>