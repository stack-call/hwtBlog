<svg xmlns="http://www.w3.org/2000/svg" width="960" height="394" viewBox="0 0 960 394" role="img" aria-label="为什么消息驱动能改善同一个 Run 的响应性？"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="394" rx="18" fill="#ffffff"/><rect x="1" y="1" width="958" height="392" rx="18" fill="none" stroke="#cbd5e1"/><text x="35" y="42" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172554">为什么消息驱动能改善同一个 Run 的响应性？</text><text x="35" y="72" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">示例：模型调用耗时 10 秒，第 3 秒收到用户新指令。</text><text x="245" y="107" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172554">0s</text><path d="M245 118L245 352" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><text x="437" y="107" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172554">3s</text><path d="M437 118L437 352" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><text x="629" y="107" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172554">6s</text><path d="M629 118L629 352" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><text x="885" y="107" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172554">10s</text><path d="M885 118L885 352" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><text x="35" y="165" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#1