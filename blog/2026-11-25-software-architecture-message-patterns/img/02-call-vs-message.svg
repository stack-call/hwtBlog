<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="直接调用、独立 Task 与消息驱动"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="480" rx="18" fill="#ffffff"/><rect x="1" y="1" width="958" height="478" rx="18" fill="none" stroke="#cbd5e1"/><text x="35" y="42" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172554">直接调用、独立 Task 与消息驱动</text><text x="35" y="72" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">区别不在于有没有 await，而在于等待的对象和控制流。</text><text x="36" y="126" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#172554">直接 await</text><text x="36" y="151" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">同一 Task 内嵌套 Future</text><rect x="345" y="105" width="210" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="146.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2563eb">Coordinator</text><rect x="720" y="105" width="200" height="70" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="820.0" y="146.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f766e">Executor</text><path d="M555 128L720 128" stroke="#64748b" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><path d="M720 155L555 155" stroke="#64748b" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="637" y="121" font-family="Noto Sans CJK SC, PingFang