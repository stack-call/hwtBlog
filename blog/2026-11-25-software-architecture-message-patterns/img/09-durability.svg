<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img" aria-label="持久化执行：不能只靠内存 Channel"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="368" rx="18" fill="#ffffff"/><rect x="1" y="1" width="958" height="366" rx="18" fill="none" stroke="#cbd5e1"/><text x="35" y="42" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172554">持久化执行：不能只靠内存 Channel</text><text x="35" y="72" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">消息边界需要配合原子提交、重试、去重和结果未知处理。</text><rect x="35" y="105" width="205" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="137.5" y="141.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#7c3aed">提交事务</text><text x="137.5" y="166.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#334155">State + Outbox</text><path d="M240 145L260 145" stroke="#64748b" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="260" y="105" width="205" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="362.5" y="141.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2563eb">领取 Effect</text><text x="362.5" y="166.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#334155">lease / claim</text><path d="M465 145L485 145" stroke="#64748b" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="485" y="105" width="205" height="80" rx="10"